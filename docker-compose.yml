services:
  postgres:
    image: postgres:17
    container_name: lazypanel-postgres
    environment:
      POSTGRES_DB: lazypanel
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: lazypanel-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: lazypanel-backend
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
volumes:
  postgres_data: